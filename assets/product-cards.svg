<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img">
  <title>Starter, launch US$35. Volume Pack, launch US$139. Profit Pack, launch US$139. Complete, launch US$279.</title>
  <defs>
    <linearGradient id="sol" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="52%" stop-color="#03E1FF"/>
      <stop offset="100%" stop-color="#DC1FFF"/>
    </linearGradient>
  </defs>
  <rect width="960" height="520" rx="18" fill="#0B0E14"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="24" y="24" width="444" height="226" rx="14" fill="#121722" stroke="#243044"/>
    <text x="48" y="72" fill="#F4F7FB" font-size="26" font-weight="700">Starter</text>
    <text x="48" y="112" fill="#C5D0DC" font-size="16">Build the infrastructure.</text>
    <text x="48" y="200" fill="url(#sol)" font-size="18" font-weight="700">Launch US$35</text>

    <rect x="492" y="24" width="444" height="226" rx="14" fill="#121722" stroke="#243044"/>
    <text x="516" y="72" fill="#F4F7FB" font-size="26" font-weight="700">Volume Pack</text>
    <text x="516" y="112" fill="#C5D0DC" font-size="16">A strategy set selected for trading</text>
    <text x="516" y="136" fill="#C5D0DC" font-size="16">volume and venue participation.</text>
    <text x="516" y="200" fill="url(#sol)" font-size="18" font-weight="700">Launch US$139</text>

    <rect x="24" y="270" width="444" height="226" rx="14" fill="#121722" stroke="#243044"/>
    <text x="48" y="318" fill="#F4F7FB" font-size="26" font-weight="700">Profit Pack</text>
    <text x="48" y="358" fill="#C5D0DC" font-size="16">A strategy set selected for net result.</text>
    <text x="48" y="446" fill="url(#sol)" font-size="18" font-weight="700">Launch US$139</text>

    <rect x="492" y="270" width="444" height="226" rx="14" fill="#121722" stroke="url(#sol)" stroke-width="1.4"/>
    <text x="516" y="318" fill="#F4F7FB" font-size="26" font-weight="700">Complete</text>
    <text x="516" y="358" fill="#C5D0DC" font-size="16">Starter and both packs together.</text>
    <text x="516" y="446" fill="url(#sol)" font-size="18" font-weight="700">Launch US$279</text>
  </g>
</svg>
