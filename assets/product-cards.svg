<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img">
  <title>Starter, launch US$35. Volume Pack, launch US$139. Profit Pack, launch US$139. Complete, launch US$279.</title>
  <defs>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#03E1FF"/>
      <stop offset="100%" stop-color="#DC1FFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#050816"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g>
      <rect x="28" y="28" width="560" height="340" rx="18" fill="#0B1120" stroke="rgba(0,255,163,0.45)"/>
      <rect x="28" y="28" width="560" height="6" fill="url(#sol)"/>
      <text x="56" y="108" fill="#FFFFFF" font-size="36" font-weight="700">Starter</text>
      <text x="56" y="160" fill="#C5D0DC" font-size="20">Build the infrastructure.</text>
      <text x="56" y="300" fill="#00FFA3" font-size="28" font-weight="700">Launch US$35</text>
    </g>
    <g>
      <rect x="612" y="28" width="560" height="340" rx="18" fill="#0B1120" stroke="rgba(3,225,255,0.4)"/>
      <rect x="612" y="28" width="560" height="6" fill="url(#sol)"/>
      <text x="640" y="108" fill="#FFFFFF" font-size="36" font-weight="700">Volume Pack</text>
      <text x="640" y="160" fill="#C5D0DC" font-size="20">A strategy set selected for trading</text>
      <text x="640" y="190" fill="#C5D0DC" font-size="20">volume and venue participation.</text>
      <text x="640" y="300" fill="#03E1FF" font-size="28" font-weight="700">Launch US$139</text>
    </g>
    <g>
      <rect x="28" y="392" width="560" height="340" rx="18" fill="#0B1120" stroke="rgba(220,31,255,0.4)"/>
      <rect x="28" y="392" width="560" height="6" fill="url(#sol)"/>
      <text x="56" y="472" fill="#FFFFFF" font-size="36" font-weight="700">Profit Pack</text>
      <text x="56" y="524" fill="#C5D0DC" font-size="20">A strategy set selected for net result.</text>
      <text x="56" y="664" fill="#DC1FFF" font-size="28" font-weight="700">Launch US$139</text>
    </g>
    <g>
      <rect x="612" y="392" width="560" height="340" rx="18" fill="#0B1120" stroke="url(#sol)" stroke-width="1.8"/>
      <rect x="612" y="392" width="560" height="6" fill="url(#sol)"/>
      <text x="640" y="472" fill="#FFFFFF" font-size="36" font-weight="700">Complete</text>
      <text x="640" y="524" fill="#C5D0DC" font-size="20">Starter and both packs together.</text>
      <text x="640" y="664" fill="#00FFA3" font-size="28" font-weight="700">Launch US$279</text>
    </g>
  </g>
</svg>
