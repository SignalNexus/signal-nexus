<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img">
  <title>Research, Strategy, Build, Execute, Analyze, and Improve form one loop.</title>
  <defs>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#03E1FF"/>
      <stop offset="100%" stop-color="#DC1FFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#050816"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="36" y="48" width="168" height="104" rx="16" fill="#0B1120" stroke="#00FFA3" stroke-width="1.6"/>
    <text x="120" y="108">Research</text>
    <rect x="224" y="48" width="168" height="104" rx="16" fill="#0B1120" stroke="#03E1FF" stroke-width="1.6"/>
    <text x="308" y="108">Strategy</text>
    <rect x="412" y="48" width="168" height="104" rx="16" fill="#0B1120" stroke="#DC1FFF" stroke-width="1.6"/>
    <text x="496" y="108">Build</text>
    <rect x="600" y="48" width="168" height="104" rx="16" fill="#0B1120" stroke="#00FFA3" stroke-width="1.6"/>
    <text x="684" y="108">Execute</text>
    <rect x="788" y="48" width="168" height="104" rx="16" fill="#0B1120" stroke="#03E1FF" stroke-width="1.6"/>
    <text x="872" y="108">Analyze</text>
    <rect x="976" y="48" width="188" height="104" rx="16" fill="#0B1120" stroke="#DC1FFF" stroke-width="1.6"/>
    <text x="1070" y="108">Improve</text>
  </g>
  <g fill="none" stroke="url(#sol)" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <path d="M204 100 H224"/>
    <path d="M392 100 H412"/>
    <path d="M580 100 H600"/>
    <path d="M768 100 H788"/>
    <path d="M956 100 H976"/>
    <path d="M1070 152 V250 H120 V152"/>
  </g>
  <g fill="#00FFA3">
    <path d="M218 94 L230 100 L218 106 Z"/>
    <path d="M406 94 L418 100 L406 106 Z"/>
    <path d="M594 94 L606 100 L594 106 Z"/>
    <path d="M782 94 L794 100 L782 106 Z"/>
    <path d="M970 94 L982 100 L970 106 Z"/>
    <path d="M120 164 L114 152 L126 152 Z"/>
  </g>
  <text x="600" y="308" fill="#00FFA3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3" text-anchor="middle">ONE LOOP</text>
</svg>
