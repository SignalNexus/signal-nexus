# Deploy one Analytics API host from inputs.
# The caller supplies the core repository, the strategies file, and the checkout token.
# This file does not name a customer, a host, or a machine.

name: analytics-deploy

on:
  workflow_call:
    inputs:
      core_repository:
        description: Repository that contains the core tree
        required: true
        type: string
      core_sha:
        description: Core commit to check out
        required: true
        type: string
      expected_strategies_blob:
        description: Git blob of the caller repository strategies file
        required: true
        type: string
      venues_manifest:
        description: Path to the venue manifest in the caller repository
        required: true
        type: string
      ssh_user:
        description: SSH user on the Analytics VM
        required: true
        type: string
      core_directory:
        description: Core checkout directory on the Analytics VM
        required: true
        type: string
      venue_directory:
        description: VenueAdd tree directory on the Analytics VM
        required: true
        type: string
      builtin_venues:
        description: Built-in venues to configure. Use none when this deployment uses no Arcus or MEXC.
        required: true
        type: string
    secrets:
      checkout_token:
        required: false
      ANALYTICS_SSH_HOST:
        required: true
      ANALYTICS_SSH_PRIVATE_KEY:
        required: true
      ANALYTICS_SSH_HOST_FINGERPRINT:
        required: true
      ANALYTICS_API_SECRET:
        required: true
      ANALYTICS_DB_PASSWORD:
        required: true
      RENDER_HEALTH_URL:
        required: true
      CADDY_SITE_ADDRESS:
        required: true
      KILL_SWITCH:
        required: false
      ANALYTICS_ARCUS_ADDRESS:
        required: false
      ARCUS_ADDRESS:
        required: false
      ARCUS_SIGNING_KEY:
        required: false
      ANALYTICS_MEXC_API_KEY:
        required: false
      ANALYTICS_MEXC_API_SECRET:
        required: false
      ANALYTICS_MEXC_FUTURES_API_KEY:
        required: false
      ANALYTICS_MEXC_FUTURES_API_SECRET:
        required: false
      MEXC_API_KEY:
        required: false
      MEXC_API_SECRET:
        required: false
      MEXC_FUTURES_API_KEY:
        required: false
      MEXC_FUTURES_API_SECRET:
        required: false
      RENDER_DEPLOY_HOOK:
        required: false
      RENDER_API_KEY:
        required: false

permissions:
  contents: read
  actions: write

jobs:
  venueadd:
    uses: ./.github/workflows/venueadd-install.yml
    with:
      core_repository: ${{ inputs.core_repository }}
      core_sha: ${{ inputs.core_sha }}
      venues_manifest: ${{ inputs.venues_manifest }}
    secrets:
      checkout_token: ${{ secrets.checkout_token }}

  deploy:
    needs: venueadd
    if: needs.venueadd.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANALYTICS_SSH_HOST: ${{ secrets.ANALYTICS_SSH_HOST }}
      ANALYTICS_SSH_USER: ${{ inputs.ssh_user }}
      CORE_DIRECTORY: ${{ inputs.core_directory }}
      VENUE_DIRECTORY: ${{ inputs.venue_directory }}
      BUILTIN_VENUES: ${{ inputs.builtin_venues }}
      ANALYTICS_SSH_HOST_FINGERPRINT: ${{ secrets.ANALYTICS_SSH_HOST_FINGERPRINT }}
      RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
      CADDY_SITE_ADDRESS: ${{ secrets.CADDY_SITE_ADDRESS }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: venueadd-bundle
          path: venueadd-bundle

      - name: Require the deployment inputs
        run: |
          missing=0
          for name in ANALYTICS_SSH_HOST ANALYTICS_SSH_USER CORE_DIRECTORY VENUE_DIRECTORY BUILTIN_VENUES ANALYTICS_SSH_HOST_FINGERPRINT RENDER_HEALTH_URL CADDY_SITE_ADDRESS RENDER_DEPLOY_HOOK RENDER_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "$name is unset" >&2
              missing=1
            fi
          done
          test "$missing" = 0

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.core_repository }}
          ref: ${{ inputs.core_sha }}
          path: core

      - uses: actions/checkout@v4
        with:
          path: caller

      - name: Confirm strategies.yml before SSH
        working-directory: caller
        env:
          PYTHONPATH: ${{ github.workspace }}/core
        run: python3 -m deploy.confirm_strategies config/strategies.yml ${{ inputs.expected_strategies_blob }}

      - name: Confirm Render health
        run: |
          ready=0
          for _ in $(seq 1 12); do
            if curl -fsS "$RENDER_HEALTH_URL" | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 15
          done
          test "$ready" = 1

      - name: Confirm the VM host key
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          ssh-keyscan -T 10 -t ed25519 "$ANALYTICS_SSH_HOST" | awk '$1 !~ /^#/' > "$RUNNER_TEMP/ssh/known_hosts"
          if ! ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" | awk '{print $2}' | grep -qx "$ANALYTICS_SSH_HOST_FINGERPRINT"; then
            echo "ssh host fingerprint mismatch" >&2
            ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" >&2 || true
            exit 1
          fi

      - name: Write the VM env file
        env:
          ANALYTICS_API_SECRET: ${{ secrets.ANALYTICS_API_SECRET }}
          KILL_SWITCH: ${{ secrets.KILL_SWITCH }}
          ANALYTICS_DB_PASSWORD: ${{ secrets.ANALYTICS_DB_PASSWORD }}
          ANALYTICS_MEXC_API_KEY: ${{ secrets.ANALYTICS_MEXC_API_KEY }}
          ANALYTICS_MEXC_API_SECRET: ${{ secrets.ANALYTICS_MEXC_API_SECRET }}
          ANALYTICS_MEXC_FUTURES_API_KEY: ${{ secrets.ANALYTICS_MEXC_FUTURES_API_KEY }}
          ANALYTICS_MEXC_FUTURES_API_SECRET: ${{ secrets.ANALYTICS_MEXC_FUTURES_API_SECRET }}
          BUILTIN_VENUES: ${{ inputs.builtin_venues }}
          ANALYTICS_ARCUS_ADDRESS: ${{ secrets.ANALYTICS_ARCUS_ADDRESS }}
          ARCUS_ADDRESS: ${{ secrets.ARCUS_ADDRESS }}
          ARCUS_SIGNING_KEY: ${{ secrets.ARCUS_SIGNING_KEY }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          MEXC_FUTURES_API_KEY: ${{ secrets.MEXC_FUTURES_API_KEY }}
          MEXC_FUTURES_API_SECRET: ${{ secrets.MEXC_FUTURES_API_SECRET }}
          PYTHONPATH: ${{ github.workspace }}/core
        run: |
          python3 -m deploy.write_env "$RUNNER_TEMP/analytics.env"
          python3 -m deploy.write_arcus_env "$RUNNER_TEMP/arcus.env"
          python3 -m deploy.write_mexc_env "$RUNNER_TEMP/mexc.env"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "site.env"
          lines = (
              "RENDER_HEALTH_URL=" + os.environ["RENDER_HEALTH_URL"],
              "CADDY_SITE_ADDRESS=" + os.environ["CADDY_SITE_ADDRESS"],
          )
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          path.chmod(0o600)
          imports = Path("venueadd-bundle") / "imports.txt"
          names = [line.strip() for line in imports.read_text(encoding="utf-8").splitlines() if line.strip()] if imports.is_file() else []
          if names:
              env_path = Path(os.environ["RUNNER_TEMP"]) / "analytics.env"
              text = env_path.read_text(encoding="utf-8")
              if not text.endswith("\n"):
                  text += "\n"
              env_path.write_text(text + "SIGNAL_NEXUS_VENUEADD=" + ",".join(names) + "\n", encoding="utf-8")
          PY

      - name: Install the key
        env:
          ANALYTICS_SSH_PRIVATE_KEY: ${{ secrets.ANALYTICS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$ANALYTICS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id"
          chmod 600 "$RUNNER_TEMP/ssh/id"

      - name: Copy the repository and env file
        run: |
          env_directory="$(dirname "$CORE_DIRECTORY")"
          ssh_opts="-i $RUNNER_TEMP/ssh/id -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          target="$ANALYTICS_SSH_USER@$ANALYTICS_SSH_HOST"
          ssh $ssh_opts "$target" "mkdir -p '$CORE_DIRECTORY'"
          config_names="locale.yml month_target.yml ops_schedule.yml protective_exit.yml strategies.yml strategy_results.yml venues.yml"
          : > "$RUNNER_TEMP/config-mtime"
          for name in $config_names; do
            config_mtime="$(ssh $ssh_opts "$target" "stat -c %Y '$CORE_DIRECTORY/config/$name'")"
            echo "$name mtime before rsync ${config_mtime}"
            printf '%s %s\n' "$name" "$config_mtime" >> "$RUNNER_TEMP/config-mtime"
          done
          rsync -az --delete \
            --exclude .git \
            --exclude .venv \
            --exclude .env \
            --exclude __pycache__ \
            --exclude .pytest_cache \
            --exclude research/data \
            --exclude config/locale.yml \
            --exclude config/month_target.yml \
            --exclude config/ops_schedule.yml \
            --exclude config/protective_exit.yml \
            --exclude config/strategies.yml \
            --exclude config/strategy_results.yml \
            --exclude config/venues.yml \
            -e "ssh $ssh_opts" \
            core/ "$target:$CORE_DIRECTORY/"
          while read -r name config_mtime; do
            config_mtime_after="$(ssh -n $ssh_opts "$target" "stat -c %Y '$CORE_DIRECTORY/config/$name'")"
            echo "$name mtime after rsync ${config_mtime_after}"
            test "$config_mtime" = "$config_mtime_after"
          done < "$RUNNER_TEMP/config-mtime"
          scp $ssh_opts "$RUNNER_TEMP/analytics.env" "$target:$env_directory/analytics.env"
          if [[ -f "$RUNNER_TEMP/arcus.env" ]]; then
            scp $ssh_opts "$RUNNER_TEMP/arcus.env" "$target:$env_directory/arcus.env"
          fi
          if [[ -f "$RUNNER_TEMP/mexc.env" ]]; then
            scp $ssh_opts "$RUNNER_TEMP/mexc.env" "$target:$env_directory/mexc.env"
          fi
          scp $ssh_opts "$RUNNER_TEMP/site.env" "$target:$env_directory/site.env"
          if [[ -s venueadd-bundle/imports.txt ]]; then
            ssh $ssh_opts "$target" "sudo -n mkdir -p '$VENUE_DIRECTORY' && sudo -n chown -R '$ANALYTICS_SSH_USER:$ANALYTICS_SSH_USER' '$(dirname "$VENUE_DIRECTORY")'"
            rsync -az --delete \
              -e "ssh $ssh_opts" \
              venueadd-bundle/trees/ "$target:/tmp/venueadd-trees/"
            scp $ssh_opts venueadd-bundle/lock.txt venueadd-bundle/lock.no-deps venueadd-bundle/imports.txt "$target:/tmp/"
            ssh $ssh_opts "$target" "command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh"
            ssh $ssh_opts "$target" "export PATH=\"\$HOME/.local/bin:\$PATH\"; cd '$CORE_DIRECTORY' && .venv/bin/python -m deploy.venueadd.apply /tmp/venueadd-trees '$VENUE_DIRECTORY' .venv/bin/python /tmp/lock.txt /tmp/imports.txt"
          fi
          : > "$RUNNER_TEMP/config-shas.txt"
          for name in $config_names; do
            if [[ ! -s "caller/config/$name" ]]; then
              echo "$name is missing" >&2
              exit 1
            fi
            config_sha="$(sha256sum "caller/config/$name" | awk '{print $1}')"
            echo "$name sha256 ${config_sha}"
            printf '%s sha256 %s\n' "$name" "$config_sha" >> "$RUNNER_TEMP/config-shas.txt"
            scp $ssh_opts "caller/config/$name" "$target:$CORE_DIRECTORY/config/$name.new"
            remote_new="$(ssh $ssh_opts "$target" "sha256sum '$CORE_DIRECTORY/config/$name.new'" | awk '{print $1}')"
            if [[ "$remote_new" != "$config_sha" ]]; then
              echo "$name.new sha256 ${remote_new} != ${config_sha}" >&2
              ssh $ssh_opts "$target" "cd '$CORE_DIRECTORY/config' && rm -f locale.yml.new month_target.yml.new ops_schedule.yml.new protective_exit.yml.new strategies.yml.new strategy_results.yml.new venues.yml.new"
              exit 1
            fi
            echo "$name.new sha256 ${remote_new}"
          done
          cat > "$RUNNER_TEMP/render_stage.py" << 'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          hook = os.environ["RENDER_DEPLOY_HOOK"]
          token = os.environ["RENDER_API_KEY"]
          health_url = os.environ["RENDER_HEALTH_URL"]
          state = Path(os.environ["RUNNER_TEMP"]) / "render-previous-deploy-id"
          markers = [
              line.strip()
              for line in Path(os.environ["CONFIG_SHA_FILE"]).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          def request(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode()
                  try:
                      payload = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      payload = {"message": "unreadable response"}
                  return exc.code, payload

          def service_id():
              path = urllib.parse.urlparse(hook).path
              name = path.rstrip("/").split("/")[-1]
              if not name.startswith("srv-"):
                  raise SystemExit("deploy hook does not name a service")
              return name

          def rows(payload):
              if isinstance(payload, dict):
                  payload = payload.get("deploys", [payload])
              found = []
              for item in payload:
                  if isinstance(item, dict):
                      found.append(item.get("deploy", item))
              return found

          def live_deploy(sid):
              status, payload = request("GET", f"https://api.render.com/v1/services/{sid}/deploys?limit=20")
              if status != 200:
                  raise SystemExit(f"list deploys returned HTTP {status}")
              for deploy in rows(payload):
                  if deploy.get("status") == "live":
                      return deploy
              raise SystemExit("no live deploy")

          def health():
              for _ in range(36):
                  try:
                      with urllib.request.urlopen(health_url, timeout=30) as resp:
                          body = resp.read().decode()
                  except Exception:
                      body = ""
                  if '"status":"ok"' in body.replace(" ", ""):
                      print('render health {"status":"ok"}')
                      return True
                  time.sleep(10)
              print("render health failed")
              return False

          def wait_deploy(sid, deploy_id, limit):
              deadline = time.time() + limit
              pending = {"created", "queued", "build_in_progress", "update_in_progress", "pre_deploy_in_progress"}
              while time.time() < deadline:
                  status, payload = request("GET", f"https://api.render.com/v1/services/{sid}/deploys/{deploy_id}")
                  deploy = payload.get("deploy", payload) if isinstance(payload, dict) else {}
                  current = deploy.get("status", "")
                  if status == 200 and current == "live":
                      return deploy
                  if status == 200 and current not in pending:
                      print(f"render deploy {deploy_id} {current}")
                      return None
                  time.sleep(15)
              print(f"render deploy {deploy_id} timed out")
              return None

          def build_has_sha(sid, owner, started):
              for direction in ("forward", "backward"):
                  params = [
                      ("ownerId", owner),
                      ("resource", sid),
                      ("type", "build"),
                      ("limit", "100"),
                      ("direction", direction),
                  ]
                  if started:
                      params.append(("startTime", started))
                  collected = ""
                  for _ in range(10):
                      status, payload = request("GET", "https://api.render.com/v1/logs?" + urllib.parse.urlencode(params))
                      if status != 200 or not isinstance(payload, dict):
                          break
                      collected += json.dumps(payload)
                      if all(line in collected for line in markers):
                          for line in markers:
                              print(line)
                          return True
                      if not payload.get("hasMore"):
                          break
                      start = payload.get("nextStartTime")
                      end = payload.get("nextEndTime")
                      if not start or not end:
                          break
                      params = [item for item in params if item[0] not in {"startTime", "endTime"}]
                      params.append(("startTime", start))
                      params.append(("endTime", end))
              print("render build log returned no matching sha256")
              return False

          def rollback():
              previous = state.read_text(encoding="utf-8").strip()
              sid = service_id()
              print(f"render rollback target {previous}")
              status, payload = request(
                  "POST",
                  f"https://api.render.com/v1/services/{sid}/rollback",
                  {"deployId": previous},
              )
              if status not in {200, 201, 202}:
                  print(f"render rollback returned HTTP {status}")
                  return False
              deploy = payload.get("deploy", payload) if isinstance(payload, dict) else {}
              deploy_id = deploy.get("id") or previous
              finished = wait_deploy(sid, deploy_id, 900)
              if finished is None:
                  return False
              print(f"render rollback {deploy_id} live")
              return health()

          def deploy():
              sid = service_id()
              status, service = request("GET", f"https://api.render.com/v1/services/{sid}")
              if status != 200:
                  raise SystemExit(f"read service returned HTTP {status}")
              previous = live_deploy(sid)
              state.write_text(previous["id"] + "\n", encoding="utf-8")
              print(f"render rollback target {previous['id']}")
              try:
                  hook_req = urllib.request.Request(hook, data=b"", method="POST")
                  with urllib.request.urlopen(hook_req, timeout=60) as resp:
                      code = resp.status
                      raw = resp.read().decode()
              except urllib.error.HTTPError as exc:
                  code = exc.code
                  raw = exc.read().decode()
              if code not in {200, 202}:
                  print(f"deploy hook returned HTTP {code}")
                  return False
              deploy_id = ""
              try:
                  body = json.loads(raw) if raw else {}
                  nested = body.get("deploy", body) if isinstance(body, dict) else {}
                  deploy_id = nested.get("id", "") if isinstance(nested, dict) else ""
              except json.JSONDecodeError:
                  deploy_id = ""
              deadline = time.time() + 90
              while not deploy_id and time.time() < deadline:
                  status, payload = request("GET", f"https://api.render.com/v1/services/{sid}/deploys?limit=5")
                  if status == 200:
                      for item in rows(payload):
                          if item.get("id") != previous["id"] and item.get("trigger") == "deploy_hook":
                              deploy_id = item["id"]
                              break
                  if not deploy_id:
                      time.sleep(5)
              if not deploy_id:
                  print("deploy hook did not start a deploy")
                  return False
              finished = wait_deploy(sid, deploy_id, 1080)
              if finished is None:
                  return False
              started = finished.get("createdAt") or previous.get("createdAt")
              if not build_has_sha(sid, service.get("ownerId", ""), started):
                  print("render build log sha256 mismatch")
                  rollback()
                  return False
              if not health():
                  rollback()
                  return False
              print(f"render deploy {deploy_id} live")
              return True

          mode = os.environ.get("RENDER_STAGE_MODE", "deploy")
          if mode == "rollback":
              raise SystemExit(0 if rollback() else 1)
          raise SystemExit(0 if deploy() else 1)
          PY
          if ! CONFIG_SHA_FILE="$RUNNER_TEMP/config-shas.txt" RENDER_STAGE_MODE=deploy python3 "$RUNNER_TEMP/render_stage.py"; then
            ssh $ssh_opts "$target" "cd '$CORE_DIRECTORY/config' && rm -f locale.yml.new month_target.yml.new ops_schedule.yml.new protective_exit.yml.new strategies.yml.new strategy_results.yml.new venues.yml.new"
            exit 1
          fi
          restore_config() {
            echo "restoring config" >&2
            for name in $config_names; do
              ssh $ssh_opts "$target" "test -s '$CORE_DIRECTORY/config/$name.prev' && cp -a '$CORE_DIRECTORY/config/$name.prev' '$CORE_DIRECTORY/config/$name'" || true
            done
            ssh $ssh_opts "$target" "CORE_DIRECTORY='$CORE_DIRECTORY' ENV_DIRECTORY='$env_directory' SERVICE_USER='$ANALYTICS_SSH_USER' bash '$CORE_DIRECTORY/deploy/analytics-vm.sh'" || true
            CONFIG_SHA_FILE="$RUNNER_TEMP/config-shas.txt" RENDER_STAGE_MODE=rollback python3 "$RUNNER_TEMP/render_stage.py" || true
          }
          promoted=0
          for name in $config_names; do
            if ! ssh $ssh_opts "$target" "test -s '$CORE_DIRECTORY/config/$name' && cp -a '$CORE_DIRECTORY/config/$name' '$CORE_DIRECTORY/config/$name.prev' && mv -f '$CORE_DIRECTORY/config/$name.new' '$CORE_DIRECTORY/config/$name'"; then
              echo "$name was not replaced" >&2
              if [[ "$promoted" -eq 1 ]]; then
                restore_config
              else
                CONFIG_SHA_FILE="$RUNNER_TEMP/config-shas.txt" RENDER_STAGE_MODE=rollback python3 "$RUNNER_TEMP/render_stage.py" || true
              fi
              exit 1
            fi
            promoted=1
            echo "$name promoted"
          done
          if ! ssh $ssh_opts "$target" "chmod 600 '$env_directory/analytics.env' '$env_directory/site.env' && if [[ -f '$env_directory/arcus.env' ]]; then chmod 600 '$env_directory/arcus.env'; fi && if [[ -f '$env_directory/mexc.env' ]]; then chmod 600 '$env_directory/mexc.env'; fi && echo preflight && systemctl is-active caddy || true && systemctl is-active signal-nexus-analytics-api || true && systemctl is-active signal-nexus-analytics-importer || true && ps -ef | grep -E 'apt-get|dpkg|analytics-vm.sh' | grep -v grep || true && if ! systemctl is-active --quiet caddy; then echo 'caddy is down; restarting the current unit'; sudo -n systemctl restart caddy || true; systemctl is-active caddy || true; sudo -n journalctl -u caddy -n 40 --no-pager || true; fi && CORE_DIRECTORY='$CORE_DIRECTORY' ENV_DIRECTORY='$env_directory' SERVICE_USER='$ANALYTICS_SSH_USER' bash '$CORE_DIRECTORY/deploy/analytics-vm.sh'"; then
            restore_config
            exit 1
          fi
          while read -r name _ expected_sha; do
            remote_sha="$(ssh -n $ssh_opts "$target" "sha256sum '$CORE_DIRECTORY/config/$name'" | awk '{print $1}')"
            if [[ "$remote_sha" != "$expected_sha" ]]; then
              echo "$name sha256 ${remote_sha} != ${expected_sha}" >&2
              restore_config
              exit 1
            fi
            echo "$name sha256 ${remote_sha}"
          done < "$RUNNER_TEMP/config-shas.txt"

      - name: Confirm the VM reads Arcus fills
        if: contains(inputs.builtin_venues, 'arcus')
        run: |
          ssh_opts="-i $RUNNER_TEMP/ssh/id -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          target="$ANALYTICS_SSH_USER@$ANALYTICS_SSH_HOST"
          env_directory="$(dirname "$CORE_DIRECTORY")"
          ssh $ssh_opts "$target" "cd '$CORE_DIRECTORY' && python3 -m deploy.confirm_arcus_address '$env_directory/analytics.env'"
          ready=0
          for _ in $(seq 1 24); do
            if ssh $ssh_opts "$target" "sudo -n journalctl -u signal-nexus-analytics-importer --since '20 min ago' --no-pager -o cat" | grep -q 'arcus fills '; then
              ready=1
              break
            fi
            sleep 15
          done
          test "$ready" = 1
          ssh $ssh_opts "$target" "sudo -n journalctl -u signal-nexus-analytics-importer --since '20 min ago' --no-pager -o cat | grep 'futures ' || true"

      - name: Confirm Arcus leverage from the VM
        if: contains(inputs.builtin_venues, 'arcus')
        run: |
          ssh_opts="-i $RUNNER_TEMP/ssh/id -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          target="$ANALYTICS_SSH_USER@$ANALYTICS_SSH_HOST"
          env_directory="$(dirname "$CORE_DIRECTORY")"
          ssh $ssh_opts "$target" "cd '$CORE_DIRECTORY' && python3 -m deploy.confirm_arcus_leverage '$env_directory/analytics.env' '$env_directory/arcus.env'"

      - name: Confirm MEXC order keys on the VM
        if: contains(inputs.builtin_venues, 'mexc_spot') || contains(inputs.builtin_venues, 'mexc_futures')
        run: |
          ssh_opts="-i $RUNNER_TEMP/ssh/id -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          target="$ANALYTICS_SSH_USER@$ANALYTICS_SSH_HOST"
          env_directory="$(dirname "$CORE_DIRECTORY")"
          ssh $ssh_opts "$target" "cd '$CORE_DIRECTORY' && python3 -m deploy.confirm_mexc_env '$env_directory/mexc.env'"

      - name: Confirm Render health again
        run: |
          ready=0
          for _ in $(seq 1 12); do
            if curl -fsS "$RENDER_HEALTH_URL" | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 15
          done
          test "$ready" = 1
